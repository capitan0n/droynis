name: Release

# Push a tag such as v1.0.0 to build, sign and publish that version; v1.3.0-rc1 is a pre-release.
#
# Once: create the key and back it up offline (another key can't update installed copies):
#   keytool -genkeypair -v -keystore droynis-release.jks -alias droynis -keyalg RSA -keysize 4096 -validity 10000
# then add the Actions secrets KEYSTORE_BASE64 (base64 -w0 droynis-release.jks), KEYSTORE_PASSWORD,
# KEY_ALIAS and KEY_PASSWORD.
#
# Each release: raise versionCode and versionName in app/build.gradle.kts, write
# fastlane/metadata/android/en-US/changelogs/<versionCode>.txt (max 500 characters; release notes
# here, on F-Droid and in the app's "What's new" dialog), run ./gradlew check, then:
#   git tag -a v1.2.3 -m "Droynis 1.2.3" && git push origin main v1.2.3
# The full checklist is in docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Add required reviewers to this environment in the repository settings to approve each release.
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # signing the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag must match versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "versionName = \"$version\"" app/build.gradle.kts; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts"
            exit 1
          fi

      - name: This version has a changelog
        run: bash ci/check-changelog.sh

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # No cache: a release is built from the tagged sources alone.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing; see the setup notes at the top of this workflow"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed release
        env:
          DROYNIS_KEYSTORE: ${{ runner.temp }}/release.jks
          DROYNIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DROYNIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DROYNIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # No configuration cache: it would store the signing passwords.
        run: ./gradlew --stacktrace --no-configuration-cache --no-build-cache check assembleRelease

      - name: Check and name the APK
        id: apk
        env:
          # SHA-256 of the release signing certificate, as every release's notes state it.
          EXPECTED_CERTIFICATE: 3604c5d2464cf53614df4ab944d1d5e1150e6144de49340b05953e23c67f0caa
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          version="${GITHUB_REF_NAME#v}"
          tools="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          built=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$built" ]; then
            echo "::error::No signed APK was built"
            exit 1
          fi
          bash ci/check-permissions.sh "$built"
          "${tools}apksigner" verify --print-certs "$built" | tee certificates.txt
          mkdir dist
          cp "$built" "dist/droynis-$version.apk"
          (cd dist && sha256sum "droynis-$version.apk" > "droynis-$version.apk.sha256")
          cat dist/*.sha256
          certificate="$(sed -n 's/.*certificate SHA-256 digest: //p' certificates.txt | head -n 1)"
          # Android refuses an update signed with another key, so a wrong key must never be published.
          if [ "$certificate" != "$EXPECTED_CERTIFICATE" ]; then
            echo "::error::Signed with certificate ${certificate:-(none)}, expected $EXPECTED_CERTIFICATE"
            exit 1
          fi
          echo "certificate=$certificate" >> "$GITHUB_OUTPUT"

      - name: Attest where the APK was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/droynis-*.apk

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE: ${{ steps.apk.outputs.certificate }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          {
            if [ -f "$changelog" ]; then
              cat "$changelog"
              echo
            fi
            echo "Signing certificate SHA-256: \`$CERTIFICATE\`"
            echo
            echo "Verify the download: \`sha256sum -c droynis-$version.apk.sha256\`, and that GitHub built it"
            echo "from this tag: \`gh attestation verify droynis-$version.apk --repo $GITHUB_REPOSITORY\`."
          } > notes.md
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Droynis $version" --notes-file notes.md "${prerelease[@]}"
