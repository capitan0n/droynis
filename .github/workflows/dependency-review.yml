name: Dependency review

# Fails a pull request that adds a dependency (a Gradle library or a GitHub Action) with a known
# vulnerability. Reads GitHub's dependency graph, which must be on (Settings › Advanced Security).
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
