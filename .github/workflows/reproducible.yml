name: Reproducible build

# F-Droid can publish the developer's own signed APK only when its build from source matches it
# byte for byte. This builds the unsigned release twice, from two directories, and compares.
#
# A tag is too late to learn that a build stopped being reproducible, so it also runs every week and
# on pull requests that change the build itself.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "**/*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "**/proguard-rules.pro"
      - "**/consumer-rules.pro"
      - ".github/workflows/reproducible.yml"
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: second/elsewhere
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build twice
        run: |
          for dir in first second/elsewhere; do
            (cd "$dir" && ./gradlew --stacktrace --no-build-cache --no-configuration-cache assembleRelease)
          done

      - name: Compare
        run: |
          a=first/app/build/outputs/apk/release/app-release-unsigned.apk
          b=second/elsewhere/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum "$a" "$b"
          if ! cmp -s "$a" "$b"; then
            echo "::error::The two builds differ; compare the uploaded APKs with diffoscope"
            exit 1
          fi

      - name: Upload both APKs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differing-apks
          path: |
            first/app/build/outputs/apk/release/app-release-unsigned.apk
            second/elsewhere/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
