name: Gradle wrapper

# Checks gradle/wrapper/gradle-wrapper.jar against Gradle's published checksums. setup-gradle in
# the other workflows does the same, but Scorecard's Binary-Artifacts check only accepts the
# committed jar when this action passes on the latest commit of main, so it runs on its own (fast).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
