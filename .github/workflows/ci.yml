name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates gradle-wrapper.jar against the official checksums.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # MIT-licensed cache instead of the proprietary default

      # check: unit tests of every module, lint, and docs/CHECKS.md matching the check definitions.
      - name: Unit tests, lint and builds
        run: ./gradlew --stacktrace check assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Release APK must not request network access
        run: |
          aapt2="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          "$aapt2" dump permissions "$apk" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::$apk requests android.permission.INTERNET"
            exit 1
          fi

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: droynis-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7
