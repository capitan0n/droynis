name: Dependency verification metadata

# Writes gradle/verification-metadata.xml: the SHA-256 of every plugin and library the build
# downloads. Once that file is committed, Gradle refuses any artifact that doesn't match it, so a
# tampered or swapped dependency fails the build instead of ending up in the APK.
#
# Run this by hand after changing a dependency (and after merging a Dependabot update), download
# the artifact, review the diff and commit the file. It pushes nothing. docs/RELEASING.md has the
# details, including what to do on macOS and Windows.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # No cache: every artifact is downloaded, so every artifact gets a checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The same tasks CI runs, so the file covers everything CI resolves.
      - name: Write the checksums
        run: >
          ./gradlew --stacktrace --no-configuration-cache --no-build-cache
          --write-verification-metadata sha256
          check assembleDebug assembleRelease assembleDebugAndroidTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 14
