name: Instrumented tests

# Emulator jobs are slow, so not on every push: weekly, and by hand before a release
# (docs/RELEASING.md). Runs the Compose UI tests against the real platform code.
on:
  schedule:
    - cron: "41 2 * * 3" # Wednesdays, 02:41 UTC
  workflow_dispatch:
    inputs:
      api-levels:
        # From Android 16 QPR2 on, SDK packages carry a minor version: API 37 is "37.0".
        description: JSON list of API levels to run on
        default: '[26, 29, 31, 34, "37.0"]'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # A scheduled run has no inputs.
        api-level: ${{ fromJSON(inputs.api-levels || '[26, 29, 31, 34, "37.0"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic # MIT-licensed cache instead of the proprietary default

      # The runner's avdmanager writes target=android-0 for minor-versioned images
      # (android-37.0); cmdline-tools 22+ handle them. The emulator action reuses
      # cmdline-tools/latest. https://github.com/ReactiveCircus/android-emulator-runner/issues/482
      - name: Update Android cmdline-tools
        run: |
          sdk="${ANDROID_HOME:?ANDROID_HOME is not set}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null
          if [ -d "$sdk/cmdline-tools/latest-2" ]; then
            rm -rf "$sdk/cmdline-tools/latest"
            mv "$sdk/cmdline-tools/latest-2" "$sdk/cmdline-tools/latest"
          fi
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # keyevent 82 dismisses a swipe lock screen so the UI test can resume the activity
          script: |
            adb shell input keyevent 82
            ./gradlew --stacktrace connectedDebugAndroidTest
