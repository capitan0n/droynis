name: Scorecard

# OpenSSF Scorecard rates the repository's supply-chain habits (pinned dependencies, token
# permissions, branch protection, signed releases…). Results go to Security › Code scanning and to
# https://scorecard.dev/viewer/?uri=github.com/capitan0n/droynis
on:
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 2" # Tuesdays, 04:29 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scorecard publishes results only from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write # upload the findings
      id-token: write # sign the published results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
